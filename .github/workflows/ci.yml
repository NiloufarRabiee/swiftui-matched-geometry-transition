name: Swift Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-build-and-tests:
    name: Build library, examples, and tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Compile practical examples
        run: swift build --target MatchedGeometryTransitionExamples

      - name: Run unit tests
        run: swift test --parallel
